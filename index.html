<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M & A Schedule</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .shift-enter {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20 selection:bg-rose-200">

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 glass-panel border-b border-slate-200 shadow-sm transition-all duration-300" id="header">
        <div class="max-w-md mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-rose-500 to-sky-600 bg-clip-text text-transparent tracking-tight">
                    Together
                </h1>
                <p class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold">Maryana & Andrew</p>
            </div>
            <div class="flex items-center -space-x-2">
                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-rose-100 to-rose-200 border-2 border-white flex items-center justify-center text-rose-600 font-bold shadow-sm text-sm">M</div>
                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-sky-100 to-sky-200 border-2 border-white flex items-center justify-center text-sky-600 font-bold shadow-sm text-sm">A</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto pt-24 px-4">
        
        <!-- Stats Card -->
        <div class="bg-white rounded-3xl p-5 shadow-lg shadow-slate-200/50 border border-slate-100 mb-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-24 h-24 bg-rose-50 rounded-full -mr-8 -mt-8 opacity-50"></div>
            <div class="absolute bottom-0 left-0 w-20 h-20 bg-sky-50 rounded-full -ml-8 -mb-8 opacity-50"></div>
            
            <div class="relative z-10 flex items-center justify-between">
                <div>
                    <h2 class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Upcoming Date Nights</h2>
                    <div class="flex items-baseline gap-1">
                        <span class="text-3xl font-bold text-slate-800" id="shared-off-count">0</span>
                        <span class="text-sm text-slate-400 font-medium">days together</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-1" id="month-label-stats">in February</p>
                </div>
                <div class="w-12 h-12 bg-white rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center">
                    <i data-lucide="heart" class="text-rose-500 fill-rose-500 w-6 h-6 animate-pulse"></i>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-between mb-4 px-2">
            <button onclick="changeMonth(-1)" class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 active:scale-95 transition shadow-sm">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <h2 class="text-lg font-bold text-slate-800 min-w-[140px] text-center" id="current-month-display">February 2026</h2>
            <button onclick="changeMonth(1)" class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 active:scale-95 transition shadow-sm">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Calendar -->
        <div class="bg-white rounded-3xl p-4 shadow-xl shadow-slate-200/60 border border-slate-100 mb-8">
            <!-- Days Header -->
            <div class="grid grid-cols-7 mb-2">
                <div class="text-center text-[10px] font-bold text-slate-400 py-2">S</div>
                <div class="text-center text-[10px] font-bold text-slate-400 py-2">M</div>
                <div class="text-center text-[10px] font-bold text-slate-400 py-2">T</div>
                <div class="text-center text-[10px] font-bold text-slate-400 py-2">W</div>
                <div class="text-center text-[10px] font-bold text-slate-400 py-2">T</div>
                <div class="text-center text-[10px] font-bold text-slate-400 py-2">F</div>
                <div class="text-center text-[10px] font-bold text-slate-400 py-2">S</div>
            </div>
            
            <!-- Grid -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-y-2 gap-x-1"></div>

            <!-- Legend -->
            <div class="mt-6 flex flex-wrap justify-center gap-4 border-t border-slate-100 pt-4">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                    <span class="text-xs font-medium text-slate-500">Maryana</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-sky-500"></span>
                    <span class="text-xs font-medium text-slate-500">Andrew</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span class="text-xs font-medium text-slate-500">Pending</span>
                </div>
            </div>
        </div>

        <!-- Next Up -->
        <div class="mb-20">
            <h3 class="text-sm font-bold text-slate-800 mb-4 px-1 flex items-center gap-2">
                <i data-lucide="calendar-clock" class="w-4 h-4 text-slate-400"></i> Next 3 Days
            </h3>
            <div id="upcoming-list" class="space-y-3"></div>
        </div>

    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 z-[100] hidden">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity opacity-0" id="modal-backdrop" onclick="closeModal()"></div>
        
        <!-- Content -->
        <div class="absolute bottom-0 left-0 right-0 sm:top-1/2 sm:left-1/2 sm:bottom-auto sm:-translate-x-1/2 sm:-translate-y-1/2 w-full max-w-sm mx-auto bg-white rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transform transition-transform translate-y-full sm:translate-y-10 scale-95" id="modal-content">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>
            
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-xl font-bold text-slate-800" id="modal-date-title">Date</h3>
                    <p class="text-xs text-slate-500 font-medium">Tap options to toggle status</p>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Maryana Section -->
            <div class="mb-6 p-4 rounded-2xl bg-rose-50/50 border border-rose-100">
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs font-bold">M</div>
                    <span class="text-sm font-bold text-rose-900">Maryana</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="updateShift('maryana', 'day')" id="btn-maryana-day" class="flex-1 py-2.5 rounded-xl text-xs font-semibold border transition-all">Work</button>
                    <button onclick="updateShift('maryana', 'pending')" id="btn-maryana-pending" class="flex-1 py-2.5 rounded-xl text-xs font-semibold border transition-all">Pending</button>
                </div>
            </div>

            <!-- Andrew Section -->
            <div class="mb-6 p-4 rounded-2xl bg-sky-50/50 border border-sky-100">
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 rounded-full bg-sky-500 text-white flex items-center justify-center text-xs font-bold">A</div>
                    <span class="text-sm font-bold text-sky-900">Andrew</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="updateShift('andrew', 'day')" id="btn-andrew-day" class="flex-1 py-2.5 rounded-xl text-xs font-semibold border transition-all">Work</button>
                    <button onclick="updateShift('andrew', 'off_approved')" id="btn-andrew-off" class="flex-1 py-2.5 rounded-xl text-xs font-semibold border transition-all">Time Off</button>
                </div>
            </div>

            <button onclick="closeModal()" class="w-full py-3.5 bg-slate-900 text-white rounded-xl font-bold shadow-lg shadow-slate-900/20 active:scale-[0.98] transition">
                Save & Close
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Data ---
        // Pre-populating with data extracted from ALL images
        const INITIAL_DATA = {
            // February 2026
            '2026-02-03': { maryana: 'day', andrew: 'day' },
            '2026-02-04': { maryana: 'day', andrew: 'day' },
            '2026-02-07': { maryana: 'day', andrew: 'day' },
            '2026-02-08': { maryana: 'day', andrew: 'day' },
            '2026-02-12': { maryana: null, andrew: 'off_approved' }, // Blue box Andrew
            '2026-02-13': { maryana: 'day', andrew: 'day' },
            '2026-02-14': { maryana: 'day', andrew: 'day' },
            '2026-02-17': { maryana: 'day', andrew: 'day' },
            '2026-02-18': { maryana: 'day', andrew: 'day' },
            '2026-02-21': { maryana: 'day', andrew: 'day' },
            '2026-02-22': { maryana: 'day', andrew: 'day' },
            '2026-02-24': { maryana: 'day', andrew: 'day' },
            '2026-02-25': { maryana: 'day', andrew: 'day' },
            
            // March 2026
            '2026-03-05': { maryana: 'day', andrew: 'day' },
            '2026-03-06': { maryana: 'day', andrew: 'day' },
            '2026-03-07': { maryana: 'day', andrew: 'day' },
            '2026-03-12': { maryana: 'pending', andrew: 'day' }, // Maryana Pending (Yellow), Andrew Work (Green)
            '2026-03-13': { maryana: 'day', andrew: 'day' },
            '2026-03-14': { maryana: null, andrew: 'day' }, // Andrew Green, Maryana blank
        };

        // Initialize state
        let currentDate = new Date(2026, 1, 1); // Start Feb 2026
        let shifts = JSON.parse(localStorage.getItem('ma_schedule')) || INITIAL_DATA;
        let selectedDateKey = null;

        // --- Logic ---

        function saveShifts() {
            localStorage.setItem('ma_schedule', JSON.stringify(shifts));
            renderCalendar();
            renderStats();
            renderUpcoming();
        }

        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
            renderStats();
            renderUpcoming();
        }

        function renderStats() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            let freeTogetherCount = 0;

            for (let i = 1; i <= daysInMonth; i++) {
                const date = new Date(year, month, i);
                const dayOfWeek = date.getDay();
                // Weekend (0=Sun, 6=Sat) is preferred for dates, but let's count all free days
                // Only counting if NEITHER works.
                const key = formatDateKey(date);
                const data = shifts[key] || {};
                
                // Logic: If neither is working 'day' or 'night' or 'pending'.
                // 'off_approved' counts as free.
                const mBusy = data.maryana === 'day' || data.maryana === 'pending';
                const aBusy = data.andrew === 'day' || data.andrew === 'night';
                
                if (!mBusy && !aBusy) {
                    freeTogetherCount++;
                }
            }
            
            // Animate number
            const el = document.getElementById('shared-off-count');
            el.innerText = freeTogetherCount;
            document.getElementById('month-label-stats').innerText = `in ${currentDate.toLocaleString('default', { month: 'long' })}`;
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            document.getElementById('current-month-display').innerText = currentDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            const firstDayIndex = new Date(year, month, 1).getDay();

            // Blanks
            for (let i = 0; i < firstDayIndex; i++) {
                const blank = document.createElement('div');
                grid.appendChild(blank);
            }

            // Days
            for (let i = 1; i <= daysInMonth; i++) {
                const date = new Date(year, month, i);
                const key = formatDateKey(date);
                const data = shifts[key] || { maryana: null, andrew: null };
                const isToday = new Date().toDateString() === date.toDateString();

                const cell = document.createElement('div');
                cell.className = `aspect-square relative rounded-2xl border transition-all duration-200 cursor-pointer flex flex-col items-center justify-between pt-1 pb-1 overflow-hidden group hover:shadow-md hover:border-slate-300 ${isToday ? 'bg-blue-50/50 border-blue-200' : 'bg-white border-slate-100'}`;
                cell.onclick = () => openModal(key);

                // Date Number
                const dateNum = document.createElement('span');
                dateNum.className = `text-sm font-medium z-10 ${isToday ? 'text-blue-600 font-bold' : 'text-slate-700'}`;
                dateNum.innerText = i;
                cell.appendChild(dateNum);

                // Visual Indicators Container
                const indicators = document.createElement('div');
                indicators.className = "w-full flex-1 flex items-end justify-between px-1 gap-1 pb-1";
                
                // Maryana Indicator (Left)
                const mIndicator = document.createElement('div');
                mIndicator.className = "flex-1 h-full max-h-[24px] rounded-lg flex items-center justify-center transition-colors";
                if (data.maryana === 'day') {
                    mIndicator.className += " bg-rose-500 shift-enter";
                    mIndicator.innerHTML = '<span class="text-[10px] text-white font-bold">M</span>';
                } else if (data.maryana === 'pending') {
                    mIndicator.className += " bg-amber-400 shift-enter";
                    mIndicator.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-amber-900"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
                } else {
                     mIndicator.className += " bg-transparent group-hover:bg-rose-50";
                }

                // Andrew Indicator (Right)
                const aIndicator = document.createElement('div');
                aIndicator.className = "flex-1 h-full max-h-[24px] rounded-lg flex items-center justify-center transition-colors";
                if (data.andrew === 'day' || data.andrew === 'night') {
                    aIndicator.className += " bg-sky-500 shift-enter";
                    aIndicator.innerHTML = '<span class="text-[10px] text-white font-bold">A</span>';
                } else if (data.andrew === 'off_approved') {
                    aIndicator.className += " bg-sky-100 shift-enter border border-sky-200";
                     aIndicator.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-sky-600"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
                } else {
                    aIndicator.className += " bg-transparent group-hover:bg-sky-50";
                }

                indicators.appendChild(mIndicator);
                indicators.appendChild(aIndicator);
                cell.appendChild(indicators);

                grid.appendChild(cell);
            }
        }

        function renderUpcoming() {
            const list = document.getElementById('upcoming-list');
            list.innerHTML = '';
            
            // Show next 3 days starting from current date context (or just simulated "today")
            // Since data is in 2026, let's just show the first 3 days of the currently viewed month 
            // OR if today is close to data, show real upcoming.
            // For this demo, let's show the first 3 days of the CURRENT VIEWED month that have ANY activity.
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            
            let count = 0;
            for(let i=1; i<=daysInMonth; i++) {
                if(count >= 3) break;
                
                const date = new Date(year, month, i);
                const key = formatDateKey(date);
                const data = shifts[key];
                
                // Only show if something is happening or it's a weekend
                if(data || date.getDay() === 0 || date.getDay() === 6) {
                    count++;
                    const row = document.createElement('div');
                    row.className = "bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center";
                    
                    const mStatus = data?.maryana;
                    const aStatus = data?.andrew;
                    const isFree = !mStatus && !aStatus; // Simplified free check

                    let content = '';
                    if (isFree) {
                         content = `<div class="text-sm font-medium text-slate-400 flex items-center gap-2 italic"><i data-lucide="heart" class="w-3 h-3 text-rose-300 fill-rose-300"></i> Free together</div>`;
                    } else {
                        content = `<div class="flex flex-col gap-1 w-full">`;
                        if(mStatus) content += `<div class="flex items-center gap-2 text-xs font-semibold ${mStatus === 'pending' ? 'text-amber-600' : 'text-rose-600'}"><span class="w-1.5 h-1.5 rounded-full ${mStatus === 'pending' ? 'bg-amber-500' : 'bg-rose-500'}"></span> Maryana: ${mStatus === 'pending' ? 'Pending' : 'Work'}</div>`;
                        if(aStatus) content += `<div class="flex items-center gap-2 text-xs font-semibold ${aStatus === 'off_approved' ? 'text-sky-400' : 'text-sky-600'}"><span class="w-1.5 h-1.5 rounded-full ${aStatus === 'off_approved' ? 'bg-sky-300' : 'bg-sky-500'}"></span> Andrew: ${aStatus === 'off_approved' ? 'Time Off' : 'Work'}</div>`;
                        content += `</div>`;
                    }

                    row.innerHTML = `
                        <div class="w-12 text-center border-r border-slate-100 pr-3 mr-3">
                            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${date.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                            <div class="text-lg font-bold text-slate-800 leading-none mt-1">${i}</div>
                        </div>
                        <div class="flex-1">
                            ${content}
                        </div>
                    `;
                    list.appendChild(row);
                }
            }
            lucide.createIcons();
        }

        // --- Modal Logic ---

        const modal = document.getElementById('edit-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');

        function openModal(dateKey) {
            selectedDateKey = dateKey;
            const date = new Date(dateKey + 'T00:00:00');
            document.getElementById('modal-date-title').innerText = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            
            // Set button states
            const data = shifts[dateKey] || {};
            
            updateBtnState('btn-maryana-day', data.maryana === 'day', 'bg-rose-500 text-white border-rose-600', 'bg-white text-slate-600 border-slate-200');
            updateBtnState('btn-maryana-pending', data.maryana === 'pending', 'bg-amber-400 text-amber-900 border-amber-500', 'bg-white text-slate-600 border-slate-200');
            
            updateBtnState('btn-andrew-day', data.andrew === 'day', 'bg-sky-500 text-white border-sky-600', 'bg-white text-slate-600 border-slate-200');
            updateBtnState('btn-andrew-off', data.andrew === 'off_approved', 'bg-sky-200 text-sky-800 border-sky-300', 'bg-white text-slate-600 border-slate-200');

            // Show Modal
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalBackdrop.classList.remove('opacity-0');
                modalContent.classList.remove('translate-y-full', 'scale-95', 'sm:translate-y-10');
            }, 10);
        }

        function closeModal() {
            modalBackdrop.classList.add('opacity-0');
            modalContent.classList.add('translate-y-full', 'scale-95', 'sm:translate-y-10');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function updateBtnState(id, isActive, activeClass, inactiveClass) {
            const btn = document.getElementById(id);
            btn.className = `flex-1 py-2.5 rounded-xl text-xs font-semibold border transition-all ${isActive ? activeClass : inactiveClass}`;
        }

        function updateShift(person, type) {
            const current = shifts[selectedDateKey] || {};
            const newVal = current[person] === type ? null : type;
            
            shifts[selectedDateKey] = { ...current, [person]: newVal };
            
            // Clean up
            if(!shifts[selectedDateKey].maryana && !shifts[selectedDateKey].andrew) {
                delete shifts[selectedDateKey];
            }
            
            saveShifts(); // This re-renders calendar behind modal
            
            // Update buttons immediately for feedback
            const data = shifts[selectedDateKey] || {};
            if(person === 'maryana') {
                updateBtnState('btn-maryana-day', data.maryana === 'day', 'bg-rose-500 text-white border-rose-600', 'bg-white text-slate-600 border-slate-200');
                updateBtnState('btn-maryana-pending', data.maryana === 'pending', 'bg-amber-400 text-amber-900 border-amber-500', 'bg-white text-slate-600 border-slate-200');
            } else {
                updateBtnState('btn-andrew-day', data.andrew === 'day', 'bg-sky-500 text-white border-sky-600', 'bg-white text-slate-600 border-slate-200');
                updateBtnState('btn-andrew-off', data.andrew === 'off_approved', 'bg-sky-200 text-sky-800 border-sky-300', 'bg-white text-slate-600 border-slate-200');
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            renderStats();
            renderUpcoming();
            lucide.createIcons();
        });

    </script>
</body>
</html>
